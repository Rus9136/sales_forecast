version: '3.8'

services:
  # PostgreSQL for Sales Forecast
  sales-forecast-db:
    image: postgres:15
    container_name: sales-forecast-db
    env_file:
      - .env.prod
    ports:
      - "5435:5432"
    volumes:
      - sales_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Sales Forecast App
  sales-forecast-app:
    build: .
    container_name: sales-forecast-app
    ports:
      - "8002:8000"
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sales-forecast-db:5432/${POSTGRES_DB}
      POSTGRES_HOST: sales-forecast-db
      POSTGRES_PORT: 5432
    volumes:
      - ./models:/app/models
    depends_on:
      sales-forecast-db:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # 1C Exchange Service
  exchange-service:
    build:
      context: /root/projects/1c-exchange-service
    container_name: exchange-service
    ports:
      - "8000:8000"
    env_file:
      - .env.exchange
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  sales_postgres_data:
